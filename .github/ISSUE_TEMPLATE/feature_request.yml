name: Feature request
description: Propose something Zwep should be able to do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Zwep makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: Describe the behaviour, not the implementation, if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" — why is that not good enough?

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Zwep indexes a curated set of sources. It is not a general web crawler.
      options:
        - label: This fits a curated, self-hosted search engine.
          required: true
