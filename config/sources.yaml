# Zwep crawl sources — the default seed for a fresh install.
#
# On first run this file is copied into a writable store at
# `data/sources.json`. After that, the Library UI, the admin API and the CLI
# edit the store; this file is only read again when the store is missing.
#
# The crawler never leaves `allowedDomains`, and `robots.txt` plus its
# `crawl-delay` are always honoured regardless of what is configured here.
#
# Fields:
#   name            Required. Identifier: letters, digits, dot, dash, underscore.
#   label           Optional display name for the Library UI.
#   description     Optional note about what this source covers.
#   type            `web` (default) or `google`.
#   seeds           Where a web crawl starts.
#   queries         For `type: google` — the searches whose results get crawled.
#   allowedDomains  The crawl boundary. Empty falls back to the seeds' own hosts.
#   sitemap         Optional sitemap.xml, merged into the seed set.
#   schedule        Cron expression, for external schedulers. Zwep does not run
#                   a scheduler itself yet — see docs/roadmap.md.
#   maxDepth        How many links deep to follow. 0 means "seeds only".
#   maxPages        Hard ceiling on pages fetched per run.
#   enabled         Set to false to keep a source configured but out of search.

sources:
  # A tiny, static, crawler-friendly page. Good for verifying an install
  # end to end before pointing Zwep at anything real.
  - name: example
    label: Example (smoke test)
    description: Single static page used to confirm the crawl → index → search path.
    type: web
    seeds:
      - https://example.com/
    allowedDomains:
      - example.com
    maxDepth: 1
    maxPages: 10

  # The project's own documentation, so a fresh install has something with
  # real structure to search.
  - name: zwep-docs
    label: Zwep documentation
    description: This project's README and docs on GitHub.
    type: web
    seeds:
      - https://github.com/philppplik/zwep
    allowedDomains:
      - github.com
    maxDepth: 1
    maxPages: 25
    enabled: false
